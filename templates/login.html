{% extends "base.html" %}
{% block content %}
<section class="auth">
    <div class="card wide">
        <h2>Login</h2>
        <p class="muted">Admins and users share this page. Admin credentials: admin / admin.</p>
        <form method="POST" class="form" id="loginForm" novalidate>
            <label>Email, username, or "admin"
                <input type="text" name="identifier" id="login-id" placeholder="you@example.com or username" required>
                <span class="field-error" id="err-login-id"></span>
            </label>
            <label>Password
                <input type="password" name="password" id="login-pw" placeholder="Password" required>
                <span class="field-error" id="err-login-pw"></span>
            </label>
            <button class="btn primary" type="submit">Sign in</button>
        </form>
        <p class="muted">Need an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function () {
    var form = document.getElementById("loginForm");
    var idField = document.getElementById("login-id");
    var pwField = document.getElementById("login-pw");
    var errId   = document.getElementById("err-login-id");
    var errPw   = document.getElementById("err-login-pw");

    function check(el, errEl, msg) {
        errEl.textContent = el.value.trim() ? "" : msg;
        el.classList.toggle("invalid", !el.value.trim());
    }

    idField.addEventListener("blur", function () { check(idField, errId, "Please enter your email or username."); });
    pwField.addEventListener("blur", function () { check(pwField, errPw, "Please enter your password."); });

    form.addEventListener("submit", function (e) {
        var ok = true;
        if (!idField.value.trim()) { errId.textContent = "Please enter your email or username."; idField.classList.add("invalid"); ok = false; }
        if (!pwField.value.trim()) { errPw.textContent = "Please enter your password."; pwField.classList.add("invalid"); ok = false; }
        if (!ok) e.preventDefault();
    });
})();
</script>
{% endblock %}
