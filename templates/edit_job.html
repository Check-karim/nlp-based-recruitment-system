{% extends "base.html" %}
{% block content %}
<section class="auth">
    <div class="card wide">
        <div class="header-row" style="margin-bottom:12px;">
            <h2>Edit job</h2>
            <a class="btn ghost" href="{{ url_for('admin_dashboard') }}">&larr; Back</a>
        </div>
        <form method="POST" class="form">
            <label>Title
                <input type="text" name="title" value="{{ job.title }}" required>
            </label>
            <label>Description (include required skills for better NLP matching)
                <textarea name="description" rows="6" required>{{ job.description }}</textarea>
            </label>
            <label>Location
                <input type="text" name="location" value="{{ job.location or '' }}" placeholder="Remote / City">
            </label>
            <div class="form-actions">
                <button class="btn primary" type="submit">Save changes</button>
                <a class="btn ghost" href="{{ url_for('admin_dashboard') }}">Cancel</a>
            </div>
        </form>
        <p class="muted small" style="margin-top:12px;">
            Created {{ job.created_at.strftime('%Y-%m-%d %H:%M') }} &middot;
            {{ job.applications|length }} application{{ 's' if job.applications|length != 1 else '' }}
        </p>
    </div>
</section>
{% endblock %}
